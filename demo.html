<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Calculator Demo</title>
    <style>
      :root {
        --bg-1: #0f172a;
        --bg-2: #1e293b;
        --panel: rgba(15, 23, 42, 0.8);
        --accent: #38bdf8;
        --accent-2: #22c55e;
        --text: #e2e8f0;
        --muted: #94a3b8;
        --button: #1f2937;
        --button-hover: #374151;
        --danger: #f87171;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: linear-gradient(135deg, var(--bg-1), var(--bg-2));
        font-family: Arial, Helvetica, sans-serif;
        color: var(--text);
      }

      .calculator {
        width: min(92vw, 360px);
        background: var(--panel);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 22px;
        padding: 22px;
        box-shadow: 0 20px 45px rgba(15, 23, 42, 0.45);
      }

      .display {
        min-height: 90px;
        display: flex;
        align-items: flex-end;
        justify-content: flex-end;
        background: rgba(15, 23, 42, 0.7);
        border-radius: 16px;
        padding: 18px 16px;
        margin-bottom: 18px;
        border: 1px solid rgba(148, 163, 184, 0.12);
        font-size: clamp(2rem, 5vw, 2.8rem);
        font-weight: 700;
        overflow: hidden;
        word-break: break-all;
      }

      .buttons {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 12px;
      }

      button {
        border: none;
        border-radius: 14px;
        padding: 18px 10px;
        font-size: 1.2rem;
        font-weight: 700;
        cursor: pointer;
        transition: transform 0.15s ease, background 0.15s ease;
        color: var(--text);
        background: var(--button);
      }

      button:hover {
        background: var(--button-hover);
      }

      button:active {
        transform: translateY(1px) scale(0.98);
      }

      .operator {
        background: rgba(56, 189, 248, 0.18);
        color: var(--accent);
      }

      .special {
        background: rgba(34, 197, 94, 0.18);
        color: var(--accent-2);
      }

      .danger {
        background: rgba(248, 113, 113, 0.18);
        color: var(--danger);
      }

      .equals {
        grid-column: span 2;
        background: linear-gradient(135deg, var(--accent), #2563eb);
        color: white;
      }
    </style>
  </head>
  <body>
    <div class="calculator" aria-label="Calculator demo">
      <div class="display" id="display" aria-live="polite">0</div>

      <div class="buttons">
        <button class="danger" data-action="clear">C</button>
        <button class="special" data-action="delete">DEL</button>
        <button class="operator" data-value="/">÷</button>
        <button class="operator" data-value="*">×</button>

        <button data-value="7">7</button>
        <button data-value="8">8</button>
        <button data-value="9">9</button>
        <button class="operator" data-value="-">−</button>

        <button data-value="4">4</button>
        <button data-value="5">5</button>
        <button data-value="6">6</button>
        <button class="operator" data-value="+">+</button>

        <button data-value="1">1</button>
        <button data-value="2">2</button>
        <button data-value="3">3</button>
        <button class="equals" data-action="equals">=</button>

        <button data-value="0" style="grid-column: span 2;">0</button>
        <button data-value=".">.</button>
      </div>
    </div>

    <script>
      const display = document.getElementById('display');
      let expression = '';
      let justEvaluated = false;

      function updateDisplay() {
        display.textContent = expression || '0';
      }

      function appendValue(value) {
        if (justEvaluated && /[0-9.]/.test(value)) {
          expression = '';
          justEvaluated = false;
        }

        if (justEvaluated && /[+\-*/]/.test(value)) {
          justEvaluated = false;
        }

        if (value === '.' && /\d*\.\d*$/.test(expression) === false && !/\d$/.test(expression)) {
          expression += '0.';
          updateDisplay();
          return;
        }

        if (value === '.' && /\d*\.\d*$/.test(expression)) {
          return;
        }

        if (/[+\-*/]/.test(value)) {
          if (!expression) return;
          if (/[+\-*/]$/.test(expression)) {
            expression = expression.slice(0, -1) + value;
            updateDisplay();
            return;
          }
        }

        expression += value;
        updateDisplay();
      }

      function clearExpression() {
        expression = '';
        justEvaluated = false;
        updateDisplay();
      }

      function deleteLast() {
        expression = expression.slice(0, -1);
        justEvaluated = false;
        updateDisplay();
      }

      function evaluateExpression() {
        if (!expression) return;

        try {
          const safeExpression = expression
            .replace(/×/g, '*')
            .replace(/÷/g, '/')
            .replace(/[^\d+\-*/.()]/g, '');

          if (!safeExpression || /[+\-*/]$/.test(safeExpression)) {
            throw new Error('Incomplete expression');
          }

          const result = Function(`"use strict"; return (${safeExpression});`)();

          if (!Number.isFinite(result)) {
            throw new Error('Division by zero');
          }

          expression = Number.isInteger(result)
            ? String(result)
            : Number(result.toFixed(10)).toString();

          justEvaluated = true;
        } catch (error) {
          expression = 'Error';
          justEvaluated = true;
        }

        updateDisplay();
      }

      document.querySelectorAll('button').forEach((button) => {
        const value = button.dataset.value;
        const action = button.dataset.action;

        button.addEventListener('click', () => {
          if (value) {
            appendValue(value);
            return;
          }

          if (action === 'clear') {
            clearExpression();
          } else if (action === 'delete') {
            deleteLast();
          } else if (action === 'equals') {
            evaluateExpression();
          }
        });
      });

      document.addEventListener('keydown', (event) => {
        const key = event.key;

        if (/^[0-9]$/.test(key) || ['+', '-', '*', '/', '.'].includes(key)) {
          appendValue(key);
          event.preventDefault();
        }

        if (key === 'Enter' || key === '=') {
          evaluateExpression();
          event.preventDefault();
        }

        if (key === 'Backspace') {
          deleteLast();
          event.preventDefault();
        }

        if (key === 'Escape') {
          clearExpression();
          event.preventDefault();
        }
      });

      updateDisplay();
    </script>
  </body>
</html>
